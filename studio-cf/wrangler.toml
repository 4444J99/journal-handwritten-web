name = "versforms-studio"
compatibility_date = "2026-06-01"
pages_build_output_dir = "dist"

# Nothing here has been deployed. The D1 database already exists on the owner's
# account and is shared with another project (it holds that project's own
# `submissions` table); the studio's tables are all prefixed vf_ (see schema.sql).
# The R2 bucket also already exists.
[[d1_databases]]
binding = "DB"
database_name = "studio-documents-prod"
database_id = "68b1a11f-00a8-4bc7-923b-0931292980c7"

[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "studio-documents-preview"
database_id = "5d3efc40-6e2d-4880-ae59-cae0b39680e5"

[[r2_buckets]]
# "ASSETS" is reserved by Pages (the static-file binding), so the bucket is bound as PHOTOS.
binding = "PHOTOS"
bucket_name = "versforms-studio-assets"

[[r2_buckets]]
binding = "STAGING"
bucket_name = "versforms-staging"

[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "versforms-public"

[vars]
PUBLISH_BUILD_MODE = "browser"
PUBLISH_SHELL_SHA256 = "a206cb90fb65ba2871713fe65ed0eb166102b221c21e6ebd968b06c156b299e0"
