# Deploys site/ to GitHub Pages.
# Manual-only until the author decides the site goes public: GitHub Pages sites
# are publicly readable even when the repository is private.
# To publish on every push to main, add:
#   push:
#     branches: [main]
#     paths: ["site/**"]
name: pages
on:
  workflow_dispatch:
    inputs:
      confirm_public:
        description: "Type publish-private-site-publicly to proceed. This publishes the private site/ on a public URL."
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # Guard: the whole private site/ would go public (archive scans, unverified transcripts,
    # Reserve pieces). A dispatch without the exact confirmation text is a skipped job.
    if: ${{ inputs.confirm_public == 'publish-private-site-publicly' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
