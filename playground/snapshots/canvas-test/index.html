  gesture = ptrs.size === 1 ? {type:"pan", moved:false, hist:[[performance.now(), e.clientX, e.clientY]]} : {type:"pinch", moved:true, ...pinchBase()};
  cv.classList.add("drag");
});
function pinchBase(){ const [a, b] = [...ptrs.values()]; return {d:Math.hypot(a.x - b.x, a.y - b.y), mx:(a.x + b.x) / 2, my:(a.y + b.y) / 2}; }
cv.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const px = p.x, py = p.y; p.x = e.clientX; p.y = e.clientY; interacted();
  if (!gesture) return;
  if (gesture.type === "pan" && ptrs.size === 1){
    if (!gesture.moved && Math.hypot(p.x - p.x0, p.y - p.y0) > 6) gesture.moved = true;
    if (gesture.moved){ cam.x -= (p.x - px) / cam.s; cam.y -= (p.y - py) / cam.s; dirty = true; }
    gesture.hist.push([performance.now(), p.x, p.y]); if (gesture.hist.length > 8) gesture.hist.shift();
  } else if (ptrs.size >= 2){
    const nb = pinchBase();
    if (gesture.type !== "pinch") Object.assign(gesture, {type:"pinch", moved:true}, nb);
    cam.x -= (nb.mx - gesture.mx) / cam.s; cam.y -= (nb.my - gesture.my) / cam.s;
    if (gesture.d > 0) zoomAt(nb.mx, nb.my, nb.d / gesture.d);
    Object.assign(gesture, nb); dirty = true;
  }
});
function endPtr(e){
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (!gesture) return;
  if (ptrs.size === 0){
    cv.classList.remove("drag");
    if (gesture.type === "pan" && !gesture.moved && e.type === "pointerup" && performance.now() - p.t0 < 600) onTap(p.x, p.y);
    else if (gesture.type === "pan" && gesture.moved && MOTION){
      const h = gesture.hist, a = h[0], b = h[h.length - 1], dt = (b[0] - a[0]) / 1000;
      if (dt > 0 && performance.now() - b[0] < 80){ vel.x = (b[1] - a[1]) / dt; vel.y = (b[2] - a[2]) / dt; vel.on = Math.hypot(vel.x, vel.y) > 60; }
    }
    gesture = null;
  } else if (ptrs.size === 1){ const [q] = [...ptrs.values()]; gesture = {type:"pan", moved:true, hist:[[performance.now(), q.x, q.y]]}; }

cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", e => {
  e.preventDefault(); interacted(); vel.on = false; camTw = null;
  let dy = e.deltaY, dx = e.deltaX; if (e.deltaMode === 1){ dy *= 16; dx *= 16; } else if (e.deltaMode === 2){ dy *= VH; dx *= VW; }
  const mouseWheel = e.deltaMode !== 0 || (dx === 0 && Math.abs(dy) >= 50 && Number.isInteger(dy));
  if (e.ctrlKey || mouseWheel) zoomAt(e.clientX, e.clientY, Math.exp(-dy * (e.ctrlKey ? .012 : .0022)));
  else { cam.x += dx / cam.s; cam.y += dy / cam.s; dirty = true; }
}, {passive:false});
function onTap(x, y){
  const now = performance.now();
  if (lastTap && now - lastTap.t < 300 && Math.hypot(x - lastTap.x, y - lastTap.y) < 30){
    clearTimeout(tapT); lastTap = null;
    const w = toWorld(x, y), ns = clamp(cam.s * 2.2, minS(), maxS());
    animCam({x:w.x - (x - VW / 2) / ns, y:w.y - (y - VH / 2) / ns, s:ns}, MOTION ? 380 : 0); return;
  }
  lastTap = {t:now, x, y};
  clearTimeout(tapT);
  tapT = setTimeout(() => { lastTap = null; singleTap(x, y); }, 260);
}
function singleTap(x, y){
  const it = hit(x, y);
  if (it){ if (focus && focus.it === it && !focus.out) releaseFocus(true); else focusOn(it); return; }
  if (focus && !focus.out){ releaseFocus(true); return; }
  toggleUI();
}
function hit(sx, sy){
  const w = toWorld(sx, sy), L = [FONTS, SCANS, PAGES];
  for (const list of L) for (let i = list.length - 1; i >= 0; i--){
    const it = list[i]; if (it.da < .3) continue;
    const dx = w.x - it.dx, dy = w.y - it.dy, c = Math.cos(-it.dr), s = Math.sin(-it.dr);
    const lx = (dx * c - dy * s) / it.ds, ly = (dx * s + dy * c) / it.ds;
    if (Math.abs(lx) < it.w / 2 && Math.abs(ly) < it.h / 2 * (it.kind === "p" ? 1 : .8)) return it;
  }
  return null;
}
function focusOn(it){
  const prev = focus && !focus.out ? focus.f : 0;
  focus = {it, f:0, f0:it === (focus && focus.it) ? prev : 0, t0:performance.now(), out:false};
  if (!MOTION) focus.f = 1;
  // readable size, then centre where it will be at that size
  let s = it.kind === "p" ? Math.min(VW * .92 / it.w, VH * .9 / it.h)
    : Math.min(VW * .9 / it.w, VH * (it.kind === "f" ? .12 : .2) / it.h);
  s = s / it.ds;
  let T = {x:it.dx, y:it.dy};
  if (it.mode === "morph"){ const p = PAGES[it.pi]; T = lerpS(homeOf(it, p), it.tg, lineT(it, morphT(s))); }
  animCam({x:T.x, y:T.y, s}, MOTION ? 900 : 0);
  dirty = true;
}
function releaseFocus(animate){
  if (!focus || focus.out) return;
  if (!animate || !MOTION){ focus = null; dirty = true; return; }
  focus.f0 = focus.f; focus.out = true; focus.t0 = performance.now(); dirty = true;
}

/* keys */
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  interacted();
  const k = e.key, step = Math.min(VW, VH) * .18;
  const pan = (dx, dy) => animCam({x:(camTw ? camTw.t.x : cam.x) + dx / cam.s, y:(camTw ? camTw.t.y : cam.y) + dy / cam.s, s:camTw ? camTw.t.s : cam.s}, MOTION ? 220 : 0);
  if (k === "Escape"){ if (focus && !focus.out){ releaseFocus(true); return; } toggleUI(); return; }
  if (k === " " && !(e.target.closest && e.target.closest("button"))){ e.preventDefault(); toggleUI(); return; }
  if (e.target.closest && e.target.closest("button") && (k === "Enter")) return;
  if (k === "ArrowLeft"){ pan(-step, 0); e.preventDefault(); }
  else if (k === "ArrowRight"){ pan(step, 0); e.preventDefault(); }
  else if (k === "ArrowUp"){ pan(0, -step); e.preventDefault(); }
  else if (k === "ArrowDown"){ pan(0, step); e.preventDefault(); }
  else if (k === "+" || k === "="){ const s = (camTw ? camTw.t.s : cam.s) * 1.5; animCam({x:cam.x, y:cam.y, s}, MOTION ? 250 : 0); }
  else if (k === "-" || k === "_"){ const s = (camTw ? camTw.t.s : cam.s) / 1.5; animCam({x:cam.x, y:cam.y, s}, MOTION ? 250 : 0); }
  else if (k === "0"){ releaseFocus(true); fitCam(overviewOf(), true); }
  else if (k === "Enter"){ if (focus && !focus.out) releaseFocus(true); else { const it = hit(VW / 2, VH / 2) || nearestCenter(); if (it) focusOn(it); } }
});

/* ---------- overlay ---------- */
const ov = document.getElementById("ov");
let hideT = null, hoverOv = false;
function showUI(){ document.body.classList.add("ui"); poke(); }
function hideUI(){ if (document.activeElement && ov.contains(document.activeElement)) document.activeElement.blur(); document.body.classList.remove("ui"); clearTimeout(hideT); }
function poke(){ clearTimeout(hideT); hideT = setTimeout(() => { if (hoverOv || (document.activeElement && ov.contains(document.activeElement) && document.activeElement.matches(":focus-visible"))){ poke(); return; } hideUI(); }, 3800); }
function toggleUI(){ document.body.classList.contains("ui") ? hideUI() : showUI(); }
ov.addEventListener("pointerenter", () => { hoverOv = true; });
ov.addEventListener("pointerleave", () => { hoverOv = false; poke(); });
ov.addEventListener("focusin", showUI);
ov.addEventListener("click", e => {
  poke(); const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.c) setState(b.dataset.c, arr);
  else if (b.dataset.a) setState(content, b.dataset.a);
  else if (b.id === "b-fit"){ releaseFocus(true); fitCam(overviewOf(), true); }
  else if (b.id === "b-theme"){
    const dark = TH.dark; const nt = dark ? "light" : "dark";
    root.setAttribute("data-theme", nt); store.set("jc.theme", nt); readTheme();
  }
});
function syncButtons(){
  ov.querySelectorAll("[data-c]").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === content ? "true" : "false"));
  ov.querySelectorAll("[data-a]").forEach(b => b.setAttribute("aria-pressed", b.dataset.a === arr ? "true" : "false"));
}
function readHash(){
  const h = (location.hash || "").slice(1).toLowerCase().split("-");
  return {c:CONTENTS.includes(h[0]) ? h[0] : "lines", a:ARRS.includes(h[1]) ? h[1] : "poem"};
}
function setHash(){ try { history.replaceState(null, "", "#" + content + "-" + arr); } catch(e){} }
addEventListener("hashchange", () => { const h = readHash(); setState(h.c, h.a, true); });

/* ---------- size ---------- */
function resize(){
  VW = innerWidth; VH = innerHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  fitPageS = Math.min(VW * .92 / 640, VH * .9 / 900);
  SPR_CAP = VW * VH > 7e5 ? 24e6 : 10e6;
  ctx._f = 0; dirty = true;
}
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(resize, 60); });
document.addEventListener("visibilitychange", () => { last = performance.now(); });

boot();
})();
</script>
